<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página em Construção - Veridicus I.A</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800;900&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 flex items-center justify-center h-screen px-6 text-slate-900">
    <div class="max-w-md w-full bg-white p-10 rounded-3xl shadow-2xl text-center border border-slate-100">
        <div class="inline-flex items-center justify-center w-20 h-20 bg-amber-100 rounded-full mb-6">
            <span class="text-4xl">🚧</span>
        </div>
        <h1 class="text-3xl font-black text-slate-900 mb-4 tracking-tighter">Em Construção</h1>
        <p class="text-slate-500 font-medium mb-8 leading-relaxed">
            Este conteúdo está sendo elaborado e validado por nossa equipe técnica. Em breve estará disponível.
        </p>
        <button onclick="window.close()" class="bg-blue-600 hover:bg-blue-700 text-white font-black py-4 px-8 rounded-2xl transition-all shadow-lg active:scale-95 uppercase text-sm tracking-widest w-full">
            Fechar
        </button>
    </div>
</body>
</html>
